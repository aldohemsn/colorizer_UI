version: '3.8'

services:
  corenlp:
    build: .
    container_name: corenlp-server
    ports:
      - "9000:9000"
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xmx2g
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9000/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
